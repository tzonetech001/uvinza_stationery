<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Manager Dashboard</h1>
    <button class="btn-logout" (click)="logout()">Logout</button>
  </div>

  <div class="dashboard-content">
    <div class="user-info">
      <h2>Welcome, {{ currentUser()?.name }}!</h2>
      <p>Email: {{ currentUser()?.email }}</p>
      <p>Role: {{ (currentUser()?.role | titlecase) || 'N/A' }}</p>
    </div>

    <div class="manager-sections">
      <div class="section">
        <h3>Staff Management</h3>
        <p>Manage staff members and assignments</p>
        <button class="btn-section">Manage Staff</button>
      </div>

      <div class="section">
        <h3>Inventory</h3>
        <p>View and manage inventory</p>
        <button class="btn-section">View Inventory</button>
      </div>

      <div class="section">
        <h3>Sales Reports</h3>
        <p>View sales and performance data</p>
        <button class="btn-section">View Reports</button>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
