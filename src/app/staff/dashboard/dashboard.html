<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Staff Dashboard</h1>
    <button class="btn-logout" (click)="logout()">Logout</button>
  </div>

  <div class="dashboard-content">
    <div class="user-info">
      <h2>Welcome, {{ currentUser()?.name }}!</h2>
      <p>Email: {{ currentUser()?.email }}</p>
      <p>Role: {{ (currentUser()?.role | titlecase) || 'N/A' }}</p>
    </div>

    <div class="staff-sections">
      <div class="section">
        <h3>My Tasks</h3>
        <p>View and manage your assigned tasks</p>
        <button class="btn-section">View Tasks</button>
      </div>

      <div class="section">
        <h3>Sales</h3>
        <p>Record and view sales transactions</p>
        <button class="btn-section">View Sales</button>
      </div>

      <div class="section">
        <h3>Profile</h3>
        <p>Update your profile information</p>
        <button class="btn-section">Edit Profile</button>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
