<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Uvinza Stationery</h1>
      <p *ngIf="step === 'verify'">{{ languageService.translate('Forgot Password', 'Umesahau Nenosiri') }}</p>
      <p *ngIf="step === 'reset'">{{ languageService.translate('Reset Password', 'Weka upya Nenosiri') }}</p>
    </div>

    <div class="auth-form">
      <form *ngIf="step === 'verify'" (ngSubmit)="onVerify()">
        <div class="form-group">
          <label for="email">{{ languageService.translate('Email', 'Barua pepe') }}</label>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            placeholder="{{ languageService.translate('Enter your email', 'Ingiza barua pepe yako') }}"
            required
          />
        </div>

        <div class="form-group">
          <label for="phone">{{ languageService.translate('Phone Number', 'Nambari ya simu') }}</label>
          <input
            type="tel"
            id="phone"
            [(ngModel)]="phone"
            name="phone"
            placeholder="{{ languageService.translate('Enter your phone number', 'Ingiza nambari yako ya simu') }}"
            required
          />
        </div>

        <button type="submit" class="btn-submit" [disabled]="isLoading">
          {{ isLoading ? languageService.translate('Verifying...', 'Inathibitisha...') : languageService.translate('Verify', 'Thibitisha') }}
        </button>
      </form>

      <form *ngIf="step === 'reset'" (ngSubmit)="onReset()">
        <div class="form-group">
          <label for="token">{{ languageService.translate('Reset Token', 'Kodi ya kuwasha tena') }}</label>
          <input
            type="text"
            id="token"
            [(ngModel)]="token"
            name="token"
            placeholder="{{ languageService.translate('Enter the reset token', 'Ingiza kodi ya kuwasha tena') }}"
            required
          />
        </div>

        <div class="form-group">
          <label for="new_password">{{ languageService.translate('New Password', 'Nenosiri Jipya') }}</label>
          <input
            type="password"
            id="new_password"
            [(ngModel)]="new_password"
            name="new_password"
            placeholder="{{ languageService.translate('Enter new password', 'Ingiza nenosiri jipya') }}"
            required
          />
        </div>

        <div class="form-group">
          <label for="confirm_password">{{ languageService.translate('Confirm New Password', 'Thibitisha Nenosiri Jipya') }}</label>
          <input
            type="password"
            id="confirm_password"
            [(ngModel)]="confirm_password"
            name="confirm_password"
            placeholder="{{ languageService.translate('Confirm new password', 'Thibitisha nenosiri jipya') }}"
            required
          />
        </div>

        <button type="submit" class="btn-submit" [disabled]="isLoading">
          {{ isLoading ? languageService.translate('Resetting...', 'Inasasisha...') : languageService.translate('Reset Password', 'Weka upya Nenosiri') }}
        </button>
      </form>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <div *ngIf="success" class="success-message">
        {{ success }}
      </div>

      <div class="auth-footer">
        <p><a (click)="goToLogin()">{{ languageService.translate('Back to Login', 'Rudi kwenye kuingia') }}</a></p>
      </div>
    </div>
  </div>
</div>
